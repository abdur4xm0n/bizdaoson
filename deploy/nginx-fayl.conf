# fayl.bizdaoson.uz - PairDrop (fleshkasiz fayl yuborish)
# Serverdagi joyi: /etc/nginx/conf.d/fayl-bizdaoson.conf
# Cloudflare: "fayl" A yozuvi -> server IP, Proxied (to'q sariq bulut).

server {
  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name fayl.bizdaoson.uz;

  ssl_certificate     /etc/nginx/ssl/favvora.crt;
  ssl_certificate_key /etc/nginx/ssl/favvora.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  include /etc/nginx/snippets/favvora-cloudflare.conf;
  server_tokens off;

  set $tashrif $scheme;
  if ($http_cf_visitor ~ '"scheme":"(https?)"') {
    set $tashrif $1;
  }
  if ($tashrif = http) {
    return 301 https://fayl.bizdaoson.uz$request_uri;
  }

  access_log /var/log/nginx/fayl-bizdaoson.access.log;

  location / {
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    # PairDrop qurilmalarni IP bo'yicha guruhlaydi. $remote_addr - Cloudflare'dan
    # tiklangan haqiqiy IP; mijoz yuborgan sarlavhalar ustidan yoziladi (soxtalashtirib bo'lmaydi).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 60s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    expires epoch;
  }
}
