# bizdaoson.uz - nginx sozlamasi (serverda nginx allaqachon ishlayotgan bo'lsa)
# Serverdagi joyi: /etc/nginx/conf.d/bizdaoson.conf
# Cloudflare orqali ishlaydi: DNS yozuvi "Proxied" (to'q sariq bulut), SSL/TLS rejimi "Full".
# Manba: https://github.com/abdur4xm0n/bizdaoson

server {
  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name bizdaoson.uz www.bizdaoson.uz;

  ssl_certificate     /etc/nginx/ssl/favvora.crt;
  ssl_certificate_key /etc/nginx/ssl/favvora.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  include /etc/nginx/snippets/favvora-cloudflare.conf;
  server_tokens off;

  # Tashrifchi qaysi protokolda kelgani (Cloudflare orqali yoki to'g'ridan-to'g'ri)
  set $tashrif $scheme;
  if ($http_cf_visitor ~ '"scheme":"(https?)"') {
    set $tashrif $1;
  }
  # "irm bizdaoson.uz/win" avval http:// bilan so'raydi - skript faqat HTTPS orqali berilsin
  if ($tashrif = http) {
    return 301 https://bizdaoson.uz$request_uri;
  }
  if ($host = www.bizdaoson.uz) {
    return 301 https://bizdaoson.uz$request_uri;
  }

  root /opt/bizdaoson/site;
  index index.html;
  charset utf-8;
  access_log /var/log/nginx/bizdaoson.access.log;

  gzip on;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Qisqa buyruqlar:  irm bizdaoson.uz/win | iex
  location ~ ^/(win|diag|yordam|tozalash|yangilash)$ {
    types { }
    default_type text/plain;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    try_files /$1.ps1 =404;
  }

  # PowerShell skriptlari oddiy matn sifatida
  location ~ \.ps1$ {
    types { }
    default_type text/plain;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
  }

  location = /apps.json {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
